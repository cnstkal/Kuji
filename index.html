<body>
<script>
/* 성능 패치: 기존 전체 UI/데이터 구조는 유지하면서 렌더/이벤트/사운드 비용만 낮춤 */
(() => {
  const NATIVE_CREATE_ELEMENT = document.createElement.bind(document);
  let raf = 0;
  const queued = new Set();
  window.__kujiPatch = {
    schedule(fn) {
      queued.add(fn);
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const jobs = [...queued];
        queued.clear();
        for (const job of jobs) { try { job(); } catch (e) { console.error(e); } }
      });
    }
  };

  /* 중복 touch/click 실행 방지 */
  document.addEventListener('click', e => {
    const t = e.target.closest?.('[data-kujitypeid]');
    if (t && t.dataset.kujiPatched === '1') e.stopImmediatePropagation();
  }, true);

  /* 화면 밖 이미지 로딩 최소화 */
  const mo = new MutationObserver(() => {
    document.querySelectorAll('img:not([loading])').forEach(img => {
      img.loading = 'lazy';
      img.decoding = 'async';
    });
  });
  mo.observe(document.documentElement, {childList:true, subtree:true});

  /* WebAudioContext 무한 생성 방지 */
  let audioCtx = null;
  window.__getKujiAudioContext = () => {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      return audioCtx;
    } catch { return null; }
  };

  /* 페이지 종료/숨김 시 비필수 관찰자 정리 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      document.querySelectorAll('.ssr-feed-toast').forEach(x => x.remove());
    }
  });
})();
</script>

<script type="module">
/* 안전성/성능 패치 모듈 */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBafQDv-J-6t0P8-es8VTVJ-liO1sYb9Lk",
  authDomain: "kuji-9b614.firebaseapp.com",
  projectId: "kuji-9b614",
  storageBucket: "kuji-9b614.firebasestorage.app",
  messagingSenderId: "206867619538",
  appId: "1:206867619538:web:8b2c20fe05f41afa47570b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* 안전한 bootstrap/failsafe. 원본 데이터는 읽기만 하고 변경하지 않음. */
let bootDone = false;
const bootTimeout = setTimeout(() => {
  if (bootDone) return;
  bootDone = true;
  const loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';
}, 6000);

onAuthStateChanged(auth, async () => {
  if (bootDone) return;
  try {
    const [productsSnap, settingsSnap] = await Promise.allSettled([
      getDocs(collection(db, 'products')),
      getDoc(doc(db, 'settings', 'global'))
    ]);
    window.__kujiBootCache = {
      products: productsSnap.status === 'fulfilled' ? productsSnap.value.docs.map(d => ({id:d.id,...d.data()})) : [],
      settings: settingsSnap.status === 'fulfilled' && settingsSnap.value.exists() ? settingsSnap.value.data() : {}
    };
  } catch (e) {
    console.warn('[KUJI] bootstrap read failed', e);
  } finally {
    bootDone = true;
    clearTimeout(bootTimeout);
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  }
});
</script>
</body>
</html>
